<!doctype html><html><head><meta charset="utf-8"><title>AoE4 Spotify</title>
<style>
/* 1.0.9 access.py 'Not invited yet' guide: one canvas grid (cards r=12, pill buttons, box r=8), Windows light / dark theme */
html,body{margin:0;width:500px;overflow:hidden;font-family:"Segoe UI",sans-serif;user-select:none;cursor:default}
.a{position:absolute}.t{position:absolute;white-space:pre;transform:translateY(-50%)}
.card{left:20px;width:460px;border-radius:12px}
.badge{width:36px;height:36px;border-radius:50%;left:38px;display:flex;align-items:center;justify-content:center;font:700 17px "Segoe UI"}
.title{left:92px;font:700 17px "Segoe UI"}
.pill{left:92px;width:200px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font:700 15px "Segoe UI"}
#em{position:absolute;left:106px;width:272px;height:26px;border:0;outline:0;background:transparent;font:400 15px "Segoe UI";padding:0}
#done div{position:static;transform:none;white-space:pre-line}
</style></head><body>
<div id="r"></div>
<input id="em" spellcheck="false" placeholder="your Spotify email">
<script>
const { invoke } = window.__TAURI__.core, Wn = window.__TAURI__.window.getCurrentWindow();
const TH = { dark: { bg: "#171717", card: "#222222", tx: "#e6e6e3", mu: "#a3a29f", g: "#1db954", gtx: "#0e1a12", gact: "#2fcf68", gdis: "#35503f", gdtx: "#5f7a68", b2: "#303030", b2a: "#3a3a3a", b2tx: "#e6e6e3", dis: "#6c6c6c", ent: "#2c2c2c", enttx: "#ececea", err: "#e8958c",
    pg: "#2e2e2e", pgbar: "#222222", pglab: "#aaaaa6", pgline: "#4e4e4e", hl: "#1e422c", hlo: "#1db954", hltx: "#e8e8e4" },
  light: { bg: "#efeeea", card: "#e3e1dc", tx: "#2b2b2a", mu: "#62615d", g: "#1a9f4a", gtx: "#f4f3ef", gact: "#178c41", gdis: "#a9c8b3", gdtx: "#e8efe9", b2: "#d4d2cc", b2a: "#c9c7c1", b2tx: "#2b2b2a", dis: "#9a9893", ent: "#f6f5f1", enttx: "#262625", err: "#b4473c",
    pg: "#f0efeb", pgbar: "#cccac5", pglab: "#585855", pgline: "#ceccc7", hl: "#d0e8d6", hlo: "#1a9f4a", hltx: "#242422" } };
const W = 500, M = 20, CX = 92, Y = [114, 240, 485], H = [114, 233, 196], TY = 30, IW = 370, IH = 118, BOXW = 300, BOXH = 44, EMAIL_RE = /^[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/;
const MSG = { bad: "That email wasn't accepted, check it and try again", busy: "Too many requests, try again later", down: "Couldn't reach the server, try later", error: "Couldn't send, try again" };
const st = { light: false, sent: false, done: false, b3t: "Send request", note: ["", "mu"], focus: false, clip: null, hh: 0 };
const $ = (id) => document.getElementById(id), em = $("em");
const valid = () => EMAIL_RE.test(em.value.trim());
function illustration(p) {   // two mini pages: Account -> 'Edit personal info' row, arrow, Email field (access.py illustration)
  const S = devicePixelRatio || 1, c = document.createElement("canvas"); c.width = IW * S; c.height = IH * S; c.style.cssText = `position:absolute;left:${CX}px;top:${Y[1] + 52}px;width:${IW}px;height:${IH}px`;
  const g = c.getContext("2d"); g.scale(S, S); const SW = 1.8, pw = (IW - 24) / 2, lx0 = 0, lx1 = pw, rx0 = IW - pw, rx1 = IW;
  const rr = (x0, y0, x1, y1, r, fill, stroke, w) => { g.beginPath(); g.roundRect(x0, y0, x1 - x0, y1 - y0, r); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.lineWidth = w; g.strokeStyle = stroke; g.stroke(); } };
  const line = (pts, col, w = SW) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.lineWidth = w; g.strokeStyle = col; g.lineCap = "round"; g.lineJoin = "round"; g.stroke(); };
  const tx = (x, y, s, col, f) => { g.font = f; g.fillStyle = col; g.textBaseline = "middle"; g.fillText(s, x, y); };
  rr(lx0, 0, lx1, IH, 10, p.pg); rr(rx0, 0, rx1, IH, 10, p.pg);
  tx(lx0 + 12, 18, "Account", p.pglab, '700 11.5px "Segoe UI"');
  const ry0 = 34, ry1 = 62, cy = (ry0 + ry1) / 2; rr(lx0 + 8, ry0, lx1 - 8, ry1, 8, p.hl, p.hlo, SW); rr(lx0 + 14, cy - 8, lx0 + 30, cy + 8, 4, p.pgline);
  const pc = [lx0 + 22, cy]; line([[pc[0] - 3.2, pc[1] + 3.2], [pc[0] + 3.6, pc[1] - 3.6]], p.hltx, 2.2);
  g.beginPath(); g.moveTo(pc[0] - 5.2, pc[1] + 5.2); g.lineTo(pc[0] - 4.6, pc[1] + 2.4); g.lineTo(pc[0] - 2.4, pc[1] + 4.6); g.fillStyle = p.hltx; g.fill();
  tx(lx0 + 37, cy, "Edit personal info", p.hltx, '700 10.5px "Segoe UI"'); line([[lx1 - 20, cy - 4], [lx1 - 16, cy], [lx1 - 20, cy + 4]], p.hltx);
  [0.62, 0.45].forEach((w, i) => rr(lx0 + 12, 78 + i * 15, lx0 + 12 + (pw - 24) * w, 84 + i * 15, 3, p.pgline));
  const px = lx1 - 44, py = cy + 2, ptr = [[0, 0], [0, 15.5], [3.8, 12.2], [6.6, 18], [9.2, 16.8], [6.5, 11.2], [11.4, 11.2]];
  g.beginPath(); ptr.forEach(([x, y], i) => i ? g.lineTo(px + x, py + y) : g.moveTo(px + x, py + y)); g.closePath(); g.fillStyle = p.hltx; g.fill(); g.lineWidth = 1.2; g.strokeStyle = p.pg; g.stroke();
  const ax0 = lx1 + 6, ax1 = rx0 - 6, ay = IH / 2; line([[ax0, ay], [ax1, ay]], p.hlo, 2); line([[ax1 - 4.5, ay - 4.5], [ax1, ay], [ax1 - 4.5, ay + 4.5]], p.hlo, 2);
  rr(rx0 + 12, 15, rx0 + 12 + (pw - 24) * 0.55, 21, 3, p.pgline); tx(rx0 + 12, 42, "Email", p.pglab, '700 10.5px "Segoe UI"');
  rr(rx0 + 8, 52, rx1 - 8, 78, 8, p.hl, p.hlo, SW); tx(rx0 + 16, 65, "you@example.com", p.hltx, '400 10px "Segoe UI"'); rr(rx0 + 12, 92, rx0 + 12 + (pw - 24) * 0.7, 98, 3, p.pgline);
  return c;
}
function draw() {
  const p = TH[st.light ? "light" : "dark"], r = $("r"); document.body.style.background = p.bg; r.innerHTML = "";
  const add = (html) => { r.insertAdjacentHTML("beforeend", html); return r.lastElementChild; };
  add(`<div class="t" style="left:28px;top:38px;font:700 26px 'Segoe UI';color:${p.tx}">Not invited yet</div>`);
  add(`<div class="t" style="left:28px;top:70px;font:400 15px 'Segoe UI';color:${p.mu}">Ask for access in 3 easy steps.</div>`);
  if (st.done) { em.style.display = "none";
    add(`<div class="a" id="done" style="left:28px;top:114px"><div style="margin-top:14px;font:700 30px 'Segoe UI';color:${p.g}">\u2714  Done!</div><div style="margin:8px 0 6px;font:700 20px 'Segoe UI';color:${p.tx}">You'll get access in about a minute.</div><div style="margin-bottom:30px;font:400 15px 'Segoe UI';color:${p.mu}">Keep this window open or reopen the app later.\nIt continues by itself when it works.</div></div>`);
    return size(Y[2] + H[2] - 24 + M); }
  const h3 = st.note[0] ? H[2] : H[2] - 24, hs = [H[0], H[1], h3];
  ["Open your Spotify page", "Find your email and copy it", "Paste or type your Spotify email"].forEach((t, i) => {
    add(`<div class="a card" style="top:${Y[i]}px;height:${hs[i]}px;background:${p.card}"></div>`);
    add(`<div class="a badge" style="top:${Y[i] + TY - 18}px;background:${p.g};color:${p.gtx}">${i + 1}</div>`);
    add(`<div class="t title" style="top:${Y[i] + TY}px;color:${p.tx}">${t}</div>`); });
  const pill = (y, label, kind, act, on) => { const e = add(`<div class="a pill" style="top:${y}px"></div>`); e.textContent = label;
    const set = (hv) => { if (kind === "g") { e.style.background = on ? (hv ? p.gact : p.g) : p.gdis; e.style.color = on ? p.gtx : p.gdtx; } else { e.style.background = hv ? p.b2a : p.b2; e.style.color = p.b2tx; } };
    set(false); if (on) { e.style.cursor = "pointer"; e.onmouseenter = () => set(true); e.onmouseleave = () => set(false); e.onclick = act; } return e; };
  pill(Y[0] + 52, "Open Spotify page", "b2", () => invoke("menu", { kind: "account" }), true);
  r.appendChild(illustration(p));
  add(`<div class="t" style="left:${CX}px;top:${Y[1] + 52 + IH + 16}px;font:400 14px 'Segoe UI';color:${p.mu}">Click \u201cEdit personal info\u201d (the row with the pencil).</div>`);
  add(`<div class="t" style="left:${CX}px;top:${Y[1] + 52 + IH + 36}px;font:400 14px 'Segoe UI';color:${p.mu}">Then select your Email and press Ctrl + C.</div>`);
  const by = Y[2] + 52; add(`<div class="a" style="left:${CX}px;top:${by}px;width:${BOXW}px;height:${BOXH}px;box-sizing:border-box;border-radius:8px;background:${p.ent};border:1.5px solid ${st.focus ? p.g : p.b2};cursor:text" onclick="em.focus()"></div>`);
  em.style.display = "block"; em.style.top = (by + BOXH / 2 - 13) + "px"; em.style.color = p.enttx; em.style.caretColor = p.enttx; document.documentElement.style.setProperty("--ph", p.dis);
  if (valid()) add(`<svg class="a" style="left:${CX + BOXW + 14}px;top:${by + BOXH / 2 - 13}px" width="26" height="26"><circle cx="13" cy="13" r="13" fill="${p.g}"/><polyline points="7.5,13.5 11.2,17.2 18.5,9.3" fill="none" stroke="${p.gtx}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  pill(by + BOXH + 14, st.b3t, "g", send, valid() && !st.sent && st.b3t === "Send request");
  if (st.note[0]) add(`<div class="t" style="left:${CX}px;top:${by + BOXH + 14 + 44 + 16}px;font:400 13px 'Segoe UI';color:${p[st.note[1]]}">${st.note[0]}</div>`);
  size(Y[2] + h3 + M);
}
function size(hh) { document.body.style.height = hh + "px"; if (hh !== st.hh) { st.hh = hh; invoke("resize", { w: W, h: hh }); } }
async function send() { if (!valid() || st.sent || st.b3t !== "Send request") return; st.b3t = "Sending\u2026"; draw();
  let r = "error"; try { r = await invoke("access_send", { email: em.value.trim() }); } catch (e) {}
  st.b3t = "Send request"; if (r === "sent" || r === "wait") { st.sent = st.done = true; } else st.note = [MSG[r] || MSG.error, "err"]; draw(); }
em.addEventListener("input", () => draw()); em.onfocus = () => { st.focus = true; draw(); }; em.onblur = () => { st.focus = false; draw(); };
em.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") Wn.close(); });
let tick = 0;
setInterval(async () => {   // fills the box as soon as an email is copied; follows the Windows theme (~2 s)
  if (!st.sent) { try { const c = (await invoke("clip_text")).trim(); if (c !== st.clip) { st.clip = c; if (EMAIL_RE.test(c)) { em.value = c; draw(); } } } catch (e) {} }
  if (++tick % 8 === 0) { try { const i = await invoke("access_info"); if (!!i.light !== st.light) { st.light = !!i.light; draw(); } } catch (e) {} }
}, 250);
setInterval(() => invoke("access_check").catch(() => {}), 60000);   // closes itself once access works (-> good to go)
(async () => { let i = {}; try { i = await invoke("access_info"); } catch (e) {} st.light = !!i.light; if (i.pending) st.sent = st.done = true; draw();
  await Wn.show(); await Wn.setFocus(); if (!st.sent) em.focus(); })();
</script>
<style>#em::placeholder{color:var(--ph)}</style>
</body></html>

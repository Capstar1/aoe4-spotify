<!doctype html>
<html><head><meta charset="utf-8"><title>AoE4 Spotify</title>
<style>
/* 1.0.9 "You're good to go" window (gtg.py), W = 400 */
*{box-sizing:border-box;margin:0;padding:0} html,body{width:400px;height:100%;background:#121212;color:#f2f2f2;font-family:"Segoe UI",sans-serif;user-select:none;overflow:hidden}
.a{position:absolute}.t{position:absolute;white-space:nowrap;transform:translateY(-50%);pointer-events:none}
.c{transform:translate(-50%,-50%)}
.b{position:absolute;display:flex;align-items:center;justify-content:center;font:700 12px "Segoe UI";cursor:pointer}
.b.p{background:#1DB954;color:#121212}.b.p:hover{background:#1ed760}.b.s{background:#1f1f1f;color:#f2f2f2;border:2px solid #9a9a9a}.b.s:hover{background:#2a2a2a;border-color:#f2f2f2}
#face{position:absolute;width:124px;height:124px;border-radius:50%;background-image:url(img/gtg_face.jpg);background-size:1240px auto;
  -webkit-mask-image:radial-gradient(circle closest-side,#000 calc(100% - 9px),transparent 100%)}
</style></head><body><div id="root"></div>
<script>
const { invoke } = window.__TAURI__.core, Wn = window.__TAURI__.window.getCurrentWindow(), W = 400;
const DUR = [70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,70,70,60,60];
let st = null, fixing = false;
const root = document.getElementById("root");
function add(html) { root.insertAdjacentHTML("beforeend", html); return root.lastElementChild; }
function mark(cx, cy, sz, kind) {   // filled circle with a check / cross / !
  const col = { ok: "#1DB954", bad: "#e5484d", warn: "#f5a524" }[kind], w = Math.max(2, sz * 0.11), z = sz;
  const inner = kind === "ok" ? `<polyline points="${z*.28},${z*.52} ${z*.44},${z*.68} ${z*.73},${z*.36}" fill="none" stroke="#121212" stroke-width="${w}" stroke-linejoin="round"/>`
    : kind === "bad" ? `<line x1="${z*.32}" y1="${z*.32}" x2="${z*.68}" y2="${z*.68}" stroke="#121212" stroke-width="${w}"/><line x1="${z*.68}" y1="${z*.32}" x2="${z*.32}" y2="${z*.68}" stroke="#121212" stroke-width="${w}"/>`
    : `<line x1="${z*.5}" y1="${z*.24}" x2="${z*.5}" y2="${z*.58}" stroke="#121212" stroke-width="${w}"/><circle cx="${z*.5}" cy="${z*.74}" r="${z*.06}" fill="#121212"/>`;
  add(`<svg class="a" style="left:${cx - sz / 2}px;top:${cy - sz / 2}px" width="${sz}" height="${sz}"><circle cx="${sz / 2}" cy="${sz / 2}" r="${sz / 2}" fill="${col}"/>${inner}</svg>`);
}
const text = (x, y, s, sz, c, b, anchor) => { const e = add(`<div class="t${anchor === "center" ? " c" : ""}"></div>`); e.textContent = s;
  Object.assign(e.style, { top: y + "px", font: `${b ? 700 : 400} ${sz}px "Segoe UI"`, color: c || "#f2f2f2" }); if (anchor === "e") e.style.right = (W - x) + "px"; else e.style.left = x + "px"; return e; };
function button(x0, y0, x1, y1, label, primary, fn) { const b = add(`<div class="b ${primary ? "p" : "s"}"></div>`); b.textContent = label;
  Object.assign(b.style, { left: x0 + "px", top: y0 + "px", width: (x1 - x0) + "px", height: (y1 - y0) + "px", borderRadius: (y1 - y0) / 2 + "px" }); b.onclick = fn; return b; }
const close = () => Wn.close();
function draw() {
  root.innerHTML = ""; const ok = st.ok; let y;
  if (ok) { const R = 62, CY = 22 + R; const f = add(`<div id="face"></div>`); f.style.left = (W / 2 - R) + "px"; f.style.top = (CY - R) + "px"; anim(f);
    add(`<div class="a" style="left:${W / 2 - R - 3.75}px;top:${CY - R - 3.75}px;width:${2 * R + 7.5}px;height:${2 * R + 7.5}px;border-radius:50%;border:1.5px solid #1DB954"></div>`);
    const bx = W / 2 + R * 0.72, by = CY + R * 0.72; add(`<div class="a" style="left:${bx - 17}px;top:${by - 17}px;width:34px;height:34px;border-radius:50%;background:#121212"></div>`); mark(bx, by, 28, "ok");
    y = CY + R + 30; }
  else { mark(W / 2, 54, 64, "bad"); y = 112; }
  text(W / 2, y, ok ? "You're good to go" : "Spotify login didn't finish", 19, null, true, "center"); y += 28;
  if (ok) {
    const appOk = st.spotify_app !== false, sub = st.name ? "Connected as " + st.name : "Connected";
    const rows = [[appOk ? "ok" : "warn", "Spotify", appOk ? sub : "Spotify app not installed", null]];
    if (st.steam) rows.push(["ok", "Age of Empires IV", "Starts with the game", null]);
    else if (st.steam === false) rows.push(["warn", "Age of Empires IV", "Launch option missing", "fix"]);
    else rows.push(["warn", "Age of Empires IV", "Steam not found", null]);
    rows.push(["warn", "Skill", "Issue detected", null]);        // the joke row (always)
    for (const [kind, lab, detail, act] of rows) {
      add(`<div class="a" style="left:20px;top:${y}px;width:${W - 40}px;height:40px;border-radius:10px;background:#1f1f1f"></div>`);
      mark(42, y + 20, 18, kind); text(60, y + 20, lab, 12, null, true);
      if (act === "fix") { text(W - 92, y + 20, detail, 11, "#9a9a9a", false, "e"); button(W - 84, y + 8, W - 30, y + 32, "Fix", true, doFix); }
      else text(W - 32, y + 20, detail, 11, "#9a9a9a", false, "e");
      y += 48; }
    y += 6; button(20, y, W / 2 - 6, y + 40, "Open panel", false, () => { invoke("show_panel"); close(); }); button(W / 2 + 6, y, W - 20, y + 40, "Done", true, close);
  } else {
    text(W / 2, y + 4, "Log in to Spotify and click Agree.", 12, "#9a9a9a", false, "center"); y += 30;
    button(20, y, W / 2 - 6, y + 40, "Close", false, close); button(W / 2 + 6, y, W - 20, y + 40, "Try again", true, () => { invoke("login"); close(); });
  }
  if (fixing) text(W / 2, 20, "Steam closes and reopens...", 10, "#9a9a9a", false, "center");
  return y + 60;
}
let at = 0, ai = 0; function anim(f) { const step = () => { if (!document.body.contains(f)) return; f.style.backgroundPosition = `${-(ai % 10) * 124}px ${-Math.floor(ai / 10) * 124}px`; at = setTimeout(() => { ai = (ai + 1) % 60; step(); }, DUR[ai] || 70); }; clearTimeout(at); step(); }
async function doFix() { if (fixing) return; fixing = true; draw(); try { st = await invoke("gtg_fix"); } catch (e) {} fixing = false; draw(); }
(async () => { st = await invoke("gtg_info"); const H = draw(); await invoke("resize", { w: W, h: H }); await Wn.show(); await Wn.setFocus(); })();
document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
</script></body></html>

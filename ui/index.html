<!doctype html>
<html><head><meta charset="utf-8"><title>AoE4 Spotify</title><link rel="stylesheet" href="app.css"></head>
<body>
  <section id="main" class="page on">
    <header><div class="logo">IV</div><h1>AoE4 Spotify</h1><span class="ver">1.1 preview</span></header>
    <div class="card row"><span class="dot" id="gdot"></span><span id="gtxt">Game</span><span class="sp"></span><span class="pill">dry run</span></div>
    <div class="card"><h2>Playlists</h2><div id="plist"></div></div>
    <div class="card row link" id="go-intros"><span class="crown">&#9813;</span><span>Age Intros</span><span class="sp"></span><span id="pips"></span><span class="chev">&rsaquo;</span></div>
    <div class="card"><h2>Activity</h2><div id="log" class="log"></div></div>
    <footer id="perf"></footer>
  </section>
  <section id="intros" class="page">
    <header><button class="back" id="back">&lsaquo;</button><span class="crown">&#9813;</span><h1>Age Intros</h1></header>
    <div id="agecards"></div>
    <p class="hint">Intro editing, Octopath tray and Add a song come in M2/M3.</p>
  </section>
  <script src="app.js"></script>
</body></html>

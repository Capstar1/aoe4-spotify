[package]
name = "aoe4engine"
version = "1.1.2"
edition = "2021"
description = "UI-independent AoE4 Spotify app logic: state, game watcher, Spotify worker, settings, 1.0.9 import, updates, presets, picker data, guides. Used by the Slint front end (and usable by any other)."

[dependencies]
aoe4core = { path = "../core" }
aoe4winsys = { path = "../winsys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
flate2 = "1"
sha2 = "0.10"

[package]
name = "aoe4spotify-slint"
version = "1.1.0"
edition = "2021"
description = "Slint prototype of the AoE4 Spotify main panel (no WebView2)"

[dependencies]
aoe4core = { path = "../crates/core" }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "unstable-winit-030"] }

[build-dependencies]
slint-build = "1.18"

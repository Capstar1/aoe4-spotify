[package]
name = "aoe4spotify-slint"
version = "1.1.2"
edition = "2021"
description = "AoE4 Spotify with a Slint UI (no WebView2): views in ui/*.slint, logic in aoe4engine"

[dependencies]
aoe4core = { path = "../crates/core" }
aoe4engine = { path = "../crates/engine" }
aoe4winsys = { path = "../crates/winsys" }
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "unstable-winit-030"] }

[build-dependencies]
slint-build = "1.18"

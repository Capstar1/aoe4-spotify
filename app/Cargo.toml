[package]
name = "aoe4spotify"
version = "1.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aoe4core = { path = "../crates/core" }
aoe4winsys = { path = "../crates/winsys" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
flate2 = "1"
sha2 = "0.10"
